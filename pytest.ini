[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Test
python_functions = test_*
# --dist loadfile keeps all tests in the same file in one worker process.
# -n auto spawns one worker per CPU.  Together they give per-file process
# isolation which prevents the GC/import access-violation that occurs on
# Windows when torch + stanza + kiwipiepy + httpx are all loaded into the
# same process for the first time under heap pressure.
addopts = --dist loadfile -n auto
filterwarnings =
    ignore::ResourceWarning
    ignore::DeprecationWarning:jieba
