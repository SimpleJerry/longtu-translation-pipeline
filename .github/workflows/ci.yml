name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch
        # GitHub runners have no GPU. The default torch wheel on Linux now pulls
        # the full CUDA stack (cuda-toolkit, cudnn, nccl, ...); loading those
        # native libraries on a GPU-less runner segfaults during `import torch`,
        # which crashes the pytest-xdist worker and then hangs the whole run.
        # The CPU build removes the CUDA libraries entirely. The PyTorch CPU
        # index also serves torch's transitive deps, so it is self-contained.
        run: pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        # requirements-training.txt is excluded: it pins CUDA wheels unavailable on CI.
        # torch is already satisfied by the CPU build above, so this step keeps it
        # and does not pull the CUDA wheels.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # Standard HuggingFace CI guards.
          OMP_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: pytest --timeout=120
