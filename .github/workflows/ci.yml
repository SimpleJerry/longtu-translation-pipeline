name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements-training.txt is excluded: it pins CUDA wheels unavailable on CI.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # Force accelerate into single-process CPU mode.
          # Without this, accelerate calls torch.distributed.init_process_group
          # which waits indefinitely for a rendezvous that never arrives on CI.
          ACCELERATE_USE_CPU: "1"
          # Standard HuggingFace CI guards
          OMP_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: pytest --timeout=120
